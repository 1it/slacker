hosts:
  # Replace with your actual test servers for parallel testing
  - address: "192.0.2.100:22"
    user: "root"
  - address: "192.0.2.101:22"
    user: "root"

resources:
  # Update apt cache first
  - type: exec
    name: apt-update
    command: "apt-get update"
    # Check if package lists exist and are recent (< 1 hour old)
    unless: "find /var/lib/apt/lists -maxdepth 1 -name '*_Packages' -mmin -60 | grep -q ."
